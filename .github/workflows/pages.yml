name: Publish dashboard to GitHub Pages

on:
  push:
    branches:
      - main
      - arena/98127de1-chinafun2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate dashboard inputs
        run: |
          python -m json.tool data/research.json > /dev/null
          python scripts/validate_research.py
          node --check app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html hotels.html restaurants.html activities.html analysis.html sources.html styles.css app.js _site/
          cp data/research.json _site/data/research.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
